spring.application.name=flight-booking-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flight_booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
